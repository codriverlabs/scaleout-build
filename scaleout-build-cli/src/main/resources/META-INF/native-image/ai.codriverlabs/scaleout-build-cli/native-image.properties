# GraalVM native-image configuration for scaleout-build-cli.
#
# Placed in META-INF/native-image/ so it is discovered automatically from the
# classpath by native-image -- both for local (-Pnative) and remote (-Premote-native) builds.
# This avoids passing flags on the command line, which can be silently ignored.
#
# Why these classes need runtime initialization:
#
# software.amazon.awssdk.auth and software.amazon.awssdk.http.urlconnection:
#   The AWS SDK credential chain (DefaultCredentialsProvider) reads environment
#   variables, ~/.aws/config, and IMDS at startup. These resources do not exist
#   at native-image build time. Initializing at build time would bake in empty
#   credentials or fail with a class initialization error.
#
# ai.codriverlabs.scaleoutbuild.controlplane.api.client:
#   SigV4Signer holds an AwsV4HttpSigner instance field initialized via
#   AwsV4HttpSigner.create(), which uses the AWS SDK service loader internally.
#   The service loader requires runtime classpath access and must not run at
#   build time.

Args = --initialize-at-run-time=software.amazon.awssdk \
       --initialize-at-run-time=ai.codriverlabs.scaleoutbuild.controlplane.api.client
