# scaleout-build MCP server configuration
# All sensitive values read from environment variables.

# Control plane endpoint — REQUIRED.
# Set via SCALEOUT_ENDPOINT environment variable.
scaleout.endpoint=${SCALEOUT_ENDPOINT}

# AWS region for SigV4 signing.
# Defaults to AWS_REGION, falls back to eu-central-1.
aws.region=${AWS_REGION:eu-central-1}

# Quarkus MCP Server: stdio transport, one connection per process.
quarkus.mcp.server.traffic-logging.enabled=false

# Server identity shown in tools/list response.
quarkus.mcp.server.server-info.name=scaleout-build
quarkus.mcp.server.server-info.version=1.0.1

# Uber-jar for easy distribution.
quarkus.package.jar.type=uber-jar

# Suppress Quarkus banner — the MCP host reads stdout, any extra text breaks the protocol.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.enable=true
# Log to stderr so stdout stays clean for JSON-RPC
quarkus.log.console.stderr=true
