name: Build and push agent image

# Builds jobrunr-build-agent's image for both linux/amd64 and linux/arm64 and publishes a single
# multi-arch manifest to ECR. Each architecture builds on a *native* runner (ubuntu-latest for
# amd64, ubuntu-24.04-arm for arm64 — confirmed current via GitHub's own hosted-runners reference,
# GA and free on both public and private repos) rather than via QEMU emulation on a single runner,
# the same way docker/setup-qemu-action would. See build-local.sh for the equivalent local
# (single-arch) build.
#
# Prerequisite this workflow does not provision, and must exist before this runs:
#   - An IAM OIDC identity provider trusting token.actions.githubusercontent.com, and an IAM role
#     with a trust policy scoped to this repository (and, ideally, to the branches/tags that should
#     be allowed to assume it), granted ecr:GetAuthorizationToken plus ecr:BatchCheckLayerAvailability
#     /ecr:PutImage/ecr:InitiateLayerUpload/ecr:UploadLayerPart/ecr:CompleteLayerUpload/
#     ecr:BatchGetImage on the target repository (e.g. the AgentRepository ECR repo jobrunr-test-infra
#     provisions). No long-lived AWS access keys are used here — see AWS's own OIDC-for-GitHub-Actions
#     guidance for how to set this role up.
#   - The AWS_ROLE_ARN and ECR_REPOSITORY_URI repository variables (Settings > Secrets and
#     variables > Actions > Variables), and AWS_REGION.

on:
  push:
    branches: [main]
    paths:
      - 'jobrunr-build-agent/**'
      - 'jobrunr-build-shared/**'
      - '.github/workflows/build-agent-image.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  build-agent-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -am also builds jobrunr-build-shared first, since jobrunr-build-agent depends on it as a
      # reactor module, not a previously-released artifact.
      - name: Build agent jar
        run: mvn -B -pl jobrunr-build-shared,jobrunr-build-agent -am install -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: agent-jar
          path: jobrunr-build-agent/target/agent.jar
          retention-days: 1

  build-and-push-image:
    needs: build-agent-jar
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            base_image: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-25
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            base_image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-jar
          path: jobrunr-build-agent/target

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: jobrunr-build-agent/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}-${{ matrix.arch }}

  push-manifest:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Assembles the two per-architecture images already pushed above into one multi-arch
      # manifest list, tagged both with the immutable commit SHA and a floating `latest`. This is
      # the registry-side join step that only jib:build (registry push) or this -- never
      # jib:buildTar/dockerBuild, and never a single-runner buildx build without native per-arch
      # runners -- can produce; confirmed by hitting jib's exact "multi-platform image building not
      # supported when building a local tar image" error directly earlier in this project's own
      # verification work.
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}" \
            -t "${{ vars.ECR_REPOSITORY_URI }}:latest" \
            "${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}-amd64" \
            "${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}-arm64"
