name: Build and push agent image

# Builds jobrunr-build-agent's image for both linux/amd64 and linux/arm64 and publishes a single
# multi-arch manifest to GHCR (ghcr.io/<owner>/jobrunr-build-agent). Each architecture builds on a
# *native* runner (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64 — confirmed current via
# GitHub's own hosted-runners reference, GA and free on both public and private repos) rather than
# via QEMU emulation on a single runner. See build-local.sh for the equivalent local build,
# including a --multi-arch mode that pushes to ECR instead (real ECR access already exists for
# this project; GHCR is used here in CI since it needs no IAM role, no OIDC provider, and no AWS
# credentials at all — auth is the workflow's own built-in GITHUB_TOKEN).
#
# No prerequisites beyond what's already true for any GitHub Actions workflow in this repo:
# GITHUB_TOKEN is minted automatically per run, and the packages: write permission below is
# sufficient to push to this repo's own GHCR namespace.

on:
  push:
    branches: [main]
    paths:
      - 'jobrunr-build-agent/**'
      - 'jobrunr-build-shared/**'
      - '.github/workflows/build-agent-image.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jobrunr-build-agent

permissions:
  contents: read
  packages: write

jobs:
  build-agent-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -am also builds jobrunr-build-shared first, since jobrunr-build-agent depends on it as a
      # reactor module, not a previously-released artifact.
      - name: Build agent jar
        run: mvn -B -pl jobrunr-build-shared,jobrunr-build-agent -am install -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: agent-jar
          path: jobrunr-build-agent/target/agent.jar
          retention-days: 1

  build-and-push-image:
    needs: build-agent-jar
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            base_image: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-25
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            base_image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-jar
          path: jobrunr-build-agent/target

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: jobrunr-build-agent/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

  push-manifest:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Assembles the two per-architecture images already pushed above into one multi-arch
      # manifest list, tagged both with the immutable commit SHA and a floating `latest`. This is
      # the registry-side join step that only jib:build (registry push) or this -- never
      # jib:buildTar/dockerBuild, and never a single-runner buildx build without native per-arch
      # runners -- can produce; confirmed by hitting jib's exact "multi-platform image building not
      # supported when building a local tar image" error directly earlier in this project's own
      # verification work.
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${{ github.sha }}-amd64" \
            "${{ env.IMAGE }}:${{ github.sha }}-arm64"
