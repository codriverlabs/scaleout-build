name: CI

# The gap this closes: until now nothing verified a push or a pull request. Every defect in the control
# plane work was found either locally or, worse, by deploying -- three startup failures reached a
# deployed Lambda while 122 unit tests passed green.
#
# Two jobs, because they fail for unrelated reasons and it is worth knowing which:
#
#   build-and-test  the reactor, including the Quarkus boot tests that a deploy would otherwise be the
#                   first thing to exercise.
#   verify-synth    the CloudFormation template in BOTH deployment modes. No unit test can cover this:
#                   the modes differ in five coupled properties (runtime, architecture, handler, zip,
#                   Web Adapter layer variant) and a mismatch among them produces a function that
#                   deploys cleanly and then fails at cold start. `cdk diff` does not show it either.
#
# Deliberately NOT here:
#   * The native image build. It runs GraalVM in a container and takes minutes; it belongs in the
#     deploy and release paths, which is also where ecp puts it.
#   * The end-to-end build. It launches real Fargate tasks and costs real money, so it stays a manual
#     step -- see docs/design/control-plane/HANDOVER.md.
#   * The agent container image, which has its own workflow with per-architecture native runners.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

# A force-push to a PR branch should not leave the superseded run burning a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # No AWS_REGION is set, deliberately. The control-plane tests boot Quarkus with %test. overrides
      # that pin an inert DynamoDB endpoint and region, so the reactor must pass with no AWS environment
      # at all. If this ever starts needing credentials or a region, that is a regression worth seeing
      # here rather than papering over with an env var.
      - name: Build and test
        run: mvn -B clean verify

      # The JVM function zip is the default deployable and is cheap to produce, so failing here rather
      # than at deploy time is worth the seconds. Its run.sh interpolates the runner jar name at build
      # time; the assertion below is what would catch that going wrong, which is a bug this project
      # inherited from ecp's equivalent script and fixed by deriving the name.
      - name: Check the JVM function zip is well formed
        run: |
          ZIP=scaleout-build-control-plane/target/function-jvm.zip
          test -f "$ZIP" || { echo "::error::$ZIP was not produced by the package phase"; exit 1; }
          unzip -l "$ZIP" | grep -q 'run.sh' \
            || { echo "::error::run.sh missing from the JVM zip; the Lambda has no handler"; exit 1; }
          JAR=$(unzip -p "$ZIP" run.sh | sed -n 's|.*/var/task/\(.*\.jar\).*|\1|p')
          echo "run.sh execs: ${JAR:-<none>}"
          test -n "$JAR" || { echo "::error::run.sh names no jar"; exit 1; }
          unzip -l "$ZIP" | grep -qF "$JAR" \
            || { echo "::error::run.sh execs $JAR, which is not in the zip (name drift)"; exit 1; }

  verify-synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Pinned rather than floating: a CDK CLI major that changes template output would otherwise turn
      # the assertions below into a mystery failure on an unrelated commit.
      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      # The script stubs its own zip placeholders, so it needs no prior Maven packaging -- synth only
      # hashes those paths as assets. It asserts, for both jvm and native: runtime, architecture,
      # handler, memory, the per-architecture Web Adapter layer, that the reaper stays JVM/arm64 with
      # no adapter layer and no Function URL, that the Function URL is AWS_IAM + RESPONSE_STREAM, and
      # that the Fargate capacity providers are associated -- the last of which is not optional:
      # EcsTaskLauncher sends a FARGATE_SPOT strategy that ECS rejects without it, which failed every
      # cell of the first real build.
      - name: Assert the template in both deployment modes
        run: ./scripts/verify-synth.sh

  # ── build-native-function ──────────────────────────────────────────────────────────────────────
  # Compiles the control-plane Lambda as a GraalVM native binary, on arm64.
  #
  # Why this job exists: native is the resting deployed state, and until this was added nothing in CI
  # compiled it. That is not a theoretical gap -- four native-only defects in this project's history
  # (a `static final SecureRandom` that GraalVM refused to build, and three reflection-metadata gaps)
  # were all found by deploying, because a JVM build cannot detect them. A change that breaks native
  # compilation would pass every other check here and fail at deploy time.
  #
  # Why arm64 specifically: a native image cannot be cross-compiled, and arm64 is the cheaper target we
  # want to be able to deploy. Building it here proves the combination that has never been produced
  # anywhere -- deploy.yml selects an arm64 runner for it, but has never run.
  #
  # No path filter: the reflection defects came from adding ordinary classes and DTOs in other modules,
  # so narrowing the trigger would miss exactly the changes that break it.
  #
  # Cost: a few minutes of arm64 runner per push. Cheaper than the deploy-and-discover loop it replaces.
  build-native-function:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The native profile sets quarkus.native.container-build=true, so Mandrel runs in a container and
      # the binary takes the architecture of this runner. No local GraalVM needed.
      - name: Build the native function
        run: ./build-local.sh --function native

      # A zip that exists is not proof. Assert the binary inside is arm64 -- an x86_64 binary on an arm64
      # Lambda fails at cold start with "Exec format error", which names nothing useful, and is precisely
      # the mistake this job exists to catch before a deploy does.
      - name: Assert the binary is arm64 and executable
        run: |
          ZIP=scaleout-build-control-plane/target/function-native.zip
          test -f "$ZIP" || { echo "::error::$ZIP was not produced"; exit 1; }
          rm -rf /tmp/fn && mkdir /tmp/fn && unzip -q "$ZIP" -d /tmp/fn
          BIN=$(find /tmp/fn -maxdepth 1 -type f ! -name '*.zip' | head -1)
          test -n "$BIN" || { echo "::error::no binary inside $ZIP"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' \
            || { echo "::error::expected an ARM aarch64 binary, got: $(file -b "$BIN")"; exit 1; }
          test -x "$BIN" || { echo "::error::$BIN is not executable"; exit 1; }
          echo "native function: $(stat -c%s "$BIN") bytes, $(file -b "$BIN" | cut -d, -f1-2)"
