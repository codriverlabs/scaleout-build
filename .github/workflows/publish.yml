name: Publish release

# Fires on a v* tag. Two deliverables, because the repo has exactly two kinds of consumer:
#
#   1. The Maven plugin and the libraries it needs, to GitHub Packages. This is what a project adds to
#      its own pom.xml.
#   2. The agent container image, re-tagged with the release version. Every build launches this image,
#      so a release that publishes the plugin without a matching agent leaves the two able to drift --
#      AgentEnvironment builds the SCALEOUT_BUILD_* variables that AgentConfig reads by name, with no
#      compile-time link between them, so a mismatch fails silently at runtime. Commit b33f9e2 was
#      exactly that: 14 variables still carrying an older prefix.
#
# There is deliberately no equivalent of ecp's release.yml here. That workflow builds a native CLI
# binary and packages Helm charts; this repo has neither, and reproducing its job graph would be
# structure without content. What is genuinely shared -- version from tag, verify before publishing,
# GHCR login -- is below.
#
# NOT published: the control plane service, the reaper, and the CDK app. Those are deployed from source
# by scripts/deploy-local.sh or the deploy workflow, not consumed as artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (for re-running a failed release)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/scaleout-build-agent

jobs:
  publish-maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Reject anything that is not a plain semver-ish version. versions:set accepts almost any
          # string, so a mistyped tag would otherwise publish an artifact at a version nobody can
          # resolve, and Packages does not allow deleting a published version to undo it.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::tag '$TAG' yields version '$VERSION', which is not X.Y.Z or X.Y.Z-qualifier"
            exit 1
          fi
          echo "Releasing $VERSION (from tag $TAG)"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Full verify, not -DskipTests. A release is the last point at which the Quarkus boot tests are
      # free; skipping them here is how a version that cannot start gets published.
      - name: Build and test
        run: mvn -B clean verify

      # Only what a consumer resolves: the plugin, the three libraries it needs at runtime, and the root
      # pom -- which is the parent every module inherits from, so omitting it would make all four
      # unresolvable. The deployables (service, reaper, CDK app, agent) are excluded; they are deployed
      # from source, not consumed as artifacts.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B deploy -DskipTests \
            -pl .,scaleout-build-shared,scaleout-build-control-plane-api,scaleout-build-ecs,scaleout-build-maven-plugin \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}

      - name: Summarise
        run: |
          {
            echo "### Published \`${VERSION}\` to GitHub Packages"
            echo
            echo '```xml'
            echo '<plugin>'
            echo '    <groupId>ai.codriverlabs</groupId>'
            echo '    <artifactId>scaleout-build-maven-plugin</artifactId>'
            echo "    <version>${VERSION}</version>"
            echo '    <configuration>'
            echo '        <endpoint>https://<id>.lambda-url.<region>.on.aws/</endpoint>'
            echo '    </configuration>'
            echo '</plugin>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tag-agent-image:
    # Independent of publish-maven: a failure to re-tag an image must not leave the Maven artifacts
    # unpublished, and vice versa. Both are idempotent, so a partial release is safe to re-run via
    # workflow_dispatch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      # Re-tags the existing multi-arch manifest rather than rebuilding it. imagetools create against an
      # existing manifest list copies it, so the released tag points at bit-identical images to the ones
      # already verified on main -- a rebuild could quietly differ, since the Mandrel base tag is
      # floating.
      - name: Tag the agent image with the release version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      # The released image is what every build will pull, so it gets the same runtime assertions as the
      # one on main: non-root, native-image runnable per architecture, the agent's environment intact,
      # and the entrypoint reaching AgentMain.
      - name: Verify the released image
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ./scripts/verify-agent-image.sh "${IMAGE}:${TAG#v}"

  # ── package-installer ──────────────────────────────────────────────────────────────────────────
  # Produces the release tarball: a pre-synthesized CDK app plus scripts/install.sh, so a consumer
  # deploys the control plane with only the AWS CLI, Node and Docker -- no Maven, no JDK, no CDK
  # source build.
  #
  # JVM packaging only, deliberately. The JVM zip is architecture-neutral bytecode and always deploys
  # to arm64, so one artifact works everywhere; a native bundle would need a per-architecture matrix
  # and two tarballs to save about $0.0003 a build. Switching to native afterwards is a redeploy from
  # source, documented in docs/USER_GUIDE.md.
  package-installer:
    needs: [publish-maven, tag-agent-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - name: Build the Lambda packages
        run: ./build-local.sh --function jvm

      # The CDK app reads ../assets/ when development=false. Staging the zips there means the synthesized
      # cdk.out/ carries them as assets, so the consumer needs nothing from this repository but the tarball.
      - name: Stage assets and pre-synthesize the CDK app
        run: |
          mkdir -p assets
          cp scaleout-build-control-plane/target/function-jvm.zip assets/control-plane-jvm.zip
          cp scaleout-build-control-plane-reaper/target/reaper.jar assets/reaper.jar
          npm install -g aws-cdk
          cd scaleout-build-control-plane-infra
          # cdk never prunes cdk.out, so a dirty one accumulates every past synth's assets. A local dry
          # run of these steps produced a 1.5 GB bundle from 62 stale 35 MB zips; CI is only safe because
          # the checkout is fresh. Make it explicit rather than incidental.
          rm -rf cdk.out
          cdk synth -c development=false -c runtimeMode=jvm --all
          echo "staged assets: $(ls -d cdk.out/asset.* | wc -l)"

      - name: Assemble the tarball
        run: |
          V="${{ steps.version.outputs.version }}"
          OUT="scaleout-build-installer-${V}"
          mkdir -p "$OUT"
          cp -r scaleout-build-control-plane-infra/cdk.out "$OUT/cdk.out"
          cp scripts/install.sh "$OUT/install.sh"
          cp LICENSE "$OUT/LICENSE"
          echo "$V" > "$OUT/VERSION"
          echo "${IMAGE}:${V}" > "$OUT/AGENT_IMAGE"
          cat > "$OUT/README.md" <<EOF
          # scaleout-build control plane ${V}

          Deploys the control plane into your AWS account. Needs the AWS CLI with credentials, Node 20+,
          and Docker. No Maven or JDK required.

              ./install.sh --region eu-west-1

          See \`./install.sh --help\` for capacity strategy and other options. Full documentation:
          https://github.com/${{ github.repository }}
          EOF
          tar czf "${OUT}.tar.gz" "$OUT"
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"

      # Installing for real needs an AWS account, so this asserts what can be asserted without one: the
      # bundle is self-contained, the script parses, and the template is a CloudFormation template.
      - name: Check the bundle is self-contained
        run: |
          V="${{ steps.version.outputs.version }}"
          rm -rf /tmp/check && mkdir /tmp/check && tar xzf "scaleout-build-installer-${V}.tar.gz" -C /tmp/check
          cd "/tmp/check/scaleout-build-installer-${V}"
          bash -n install.sh
          test -f cdk.out/ScaleoutBuildControlPlane.template.json
          python3 -c "import json;t=json.load(open('cdk.out/ScaleoutBuildControlPlane.template.json'));assert t['Resources'],'no resources'"
          N="$(ls -d cdk.out/asset.* 2>/dev/null | wc -l)"
          test "$N" -eq 2 || { echo "::error::expected 2 staged assets (service zip + reaper jar), found $N"; exit 1; }
          ./install.sh --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: scaleout-build-installer-*.tar.gz*

  # ── release ────────────────────────────────────────────────────────────────────────────────────
  release:
    needs: [package-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: installer
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install the control plane

            ```bash
            TAG=${{ inputs.tag || github.ref_name }}
            curl -fsSL -O https://github.com/${{ github.repository }}/releases/download/${TAG}/scaleout-build-installer-${TAG#v}.tar.gz
            tar xzf scaleout-build-installer-${TAG#v}.tar.gz
            cd scaleout-build-installer-${TAG#v}
            ./install.sh --region eu-west-1
            ```

            Needs the AWS CLI, Node 20+, and Docker. No Maven or JDK.

            ## Use the plugin

            Published to GitHub Packages; see the repository README for the `<plugin>` block and the two
            IAM permissions your developers need.

            ## Agent image

            `${{ env.IMAGE }}:${{ inputs.tag || github.ref_name }}` — multi-architecture (`amd64`,
            `arm64`), built on native runners rather than under emulation, and verified per architecture.
