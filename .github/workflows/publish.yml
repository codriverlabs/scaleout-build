name: Publish release

# Fires on a v* tag. Two deliverables, because the repo has exactly two kinds of consumer:
#
#   1. The Maven plugin and the libraries it needs, to GitHub Packages. This is what a project adds to
#      its own pom.xml.
#   2. The agent container image, re-tagged with the release version. Every build launches this image,
#      so a release that publishes the plugin without a matching agent leaves the two able to drift --
#      AgentEnvironment builds the SCALEOUT_BUILD_* variables that AgentConfig reads by name, with no
#      compile-time link between them, so a mismatch fails silently at runtime. Commit b33f9e2 was
#      exactly that: 14 variables still carrying an older prefix.
#
# There is deliberately no equivalent of ecp's release.yml here. That workflow builds a native CLI
# binary and packages Helm charts; this repo has neither, and reproducing its job graph would be
# structure without content. What is genuinely shared -- version from tag, verify before publishing,
# GHCR login -- is below.
#
# NOT published: the control plane service, the reaper, and the CDK app. Those are deployed from source
# by scripts/deploy-local.sh or the deploy workflow, not consumed as artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (for re-running a failed release)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/scaleout-build-agent

jobs:
  publish-maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Reject anything that is not a plain semver-ish version. versions:set accepts almost any
          # string, so a mistyped tag would otherwise publish an artifact at a version nobody can
          # resolve, and Packages does not allow deleting a published version to undo it.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::tag '$TAG' yields version '$VERSION', which is not X.Y.Z or X.Y.Z-qualifier"
            exit 1
          fi
          echo "Releasing $VERSION (from tag $TAG)"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Full verify, not -DskipTests. A release is the last point at which the Quarkus boot tests are
      # free; skipping them here is how a version that cannot start gets published.
      - name: Build and test
        run: mvn -B clean verify

      # Only what a consumer resolves: the plugin, the three libraries it needs at runtime, and the root
      # pom -- which is the parent every module inherits from, so omitting it would make all four
      # unresolvable. The deployables (service, reaper, CDK app, agent) are excluded; they are deployed
      # from source, not consumed as artifacts.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B deploy -DskipTests \
            -pl .,scaleout-build-shared,scaleout-build-control-plane-api,scaleout-build-ecs,scaleout-build-maven-plugin \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}

      - name: Summarise
        run: |
          {
            echo "### Published `${VERSION}` to GitHub Packages"
            echo
            echo '```xml'
            echo '<plugin>'
            echo '    <groupId>ai.codriverlabs</groupId>'
            echo '    <artifactId>scaleout-build-maven-plugin</artifactId>'
            echo "    <version>${VERSION}</version>"
            echo '    <configuration>'
            echo '        <endpoint>https://<id>.lambda-url.<region>.on.aws/</endpoint>'
            echo '    </configuration>'
            echo '</plugin>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tag-agent-image:
    # Independent of publish-maven: a failure to re-tag an image must not leave the Maven artifacts
    # unpublished, and vice versa. Both are idempotent, so a partial release is safe to re-run via
    # workflow_dispatch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      # Re-tags the existing multi-arch manifest rather than rebuilding it. imagetools create against an
      # existing manifest list copies it, so the released tag points at bit-identical images to the ones
      # already verified on main -- a rebuild could quietly differ, since the Mandrel base tag is
      # floating.
      - name: Tag the agent image with the release version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      # The released image is what every build will pull, so it gets the same runtime assertions as the
      # one on main: non-root, native-image runnable per architecture, the agent's environment intact,
      # and the entrypoint reaching AgentMain.
      - name: Verify the released image
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ./scripts/verify-agent-image.sh "${IMAGE}:${TAG#v}"

  # ── package-installer ──────────────────────────────────────────────────────────────────────────
  # Produces the release tarball: a pre-synthesized CDK app plus scripts/install.sh, so a consumer
  # deploys the control plane with only the AWS CLI, Node and Docker -- no Maven, no JDK, no CDK
  # source build.
  #
  # Native arm64, on an arm64 runner. A GraalVM binary cannot be cross-compiled, so the runner
  # architecture *is* the deployed architecture; `runs-on: ubuntu-24.04-arm` is load-bearing, not a
  # preference. Getting it wrong produces an x86_64 binary that fails at cold start on an arm64 Lambda
  # with "Exec format error", naming nothing useful.
  #
  # Why native arm64 rather than the JVM zip that was here before: measured, native cold start is
  # 480-524 ms against 2345 ms on the JVM, at 256 MB instead of 384 MB, and arm64 is the cheaper of the
  # two Lambda architectures. Since a release bundle is built once and deployed many times, there is no
  # reason to ship the slower, dearer default.
  #
  # Lambda code travels *in* the bundle rather than being pulled at install time. That is deliberate:
  # cdk.out addresses its assets by content hash, so a zip downloaded afterwards could not be
  # substituted without re-synthesizing, which would put Maven and a JDK back into the install path.
  # `cdk deploy --app cdk.out` uploads the asset to the CDK bootstrap bucket itself.
  #
  # Lambda container images were considered and rejected: Lambda can only pull images from ECR, never
  # from ghcr.io, and unlike the agent image -- read at task launch -- a Lambda image must exist at
  # function-creation time. That would force the install into repos-then-images-then-stack, and trade a
  # measured cold start for an unmeasured one.
  package-installer:
    needs: [publish-maven, tag-agent-image]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - name: Build the Lambda packages (native, this runner's architecture)
        run: ./build-local.sh --function native

      # The runner architecture is the deployed architecture, so assert it rather than trust the label.
      - name: Assert the native binary is arm64
        run: |
          rm -rf /tmp/fn && mkdir /tmp/fn
          unzip -q scaleout-build-control-plane/target/function-native.zip -d /tmp/fn
          BIN=$(find /tmp/fn -maxdepth 1 -type f | head -1)
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' \
            || { echo "::error::bundle would ship $(file -b "$BIN" | cut -d, -f2) to an arm64 Lambda"; exit 1; }

      # The CDK app reads ../assets/ when development=false. Staging the zips there means the synthesized
      # cdk.out/ carries them as assets, so the consumer needs nothing from this repository but the tarball.
      - name: Stage assets and pre-synthesize the CDK app
        run: |
          mkdir -p assets
          cp scaleout-build-control-plane/target/function-native.zip assets/control-plane-native.zip
          cp scaleout-build-control-plane-reaper/target/reaper.jar assets/reaper.jar
          npm install -g aws-cdk
          cd scaleout-build-control-plane-infra
          # cdk never prunes cdk.out, so a dirty one accumulates every past synth's assets. A local dry
          # run of these steps produced a 1.5 GB bundle from 62 stale 35 MB zips; CI is only safe because
          # the checkout is fresh. Make it explicit rather than incidental.
          rm -rf cdk.out
          # runtimeMode=native defaults nativeArch to arm64 in the stack, matching this runner.
          cdk synth -c development=false -c runtimeMode=native --all
          echo "staged assets: $(ls -d cdk.out/asset.* | wc -l)"

      - name: Assemble the tarball
        run: |
          V="${{ steps.version.outputs.version }}"
          OUT="scaleout-build-installer-${V}"
          mkdir -p "$OUT"
          cp -r scaleout-build-control-plane-infra/cdk.out "$OUT/cdk.out"
          cp scripts/install.sh "$OUT/install.sh"
          cp LICENSE "$OUT/LICENSE"
          echo "$V" > "$OUT/VERSION"
          echo "${IMAGE}:${V}" > "$OUT/AGENT_IMAGE"
          cat > "$OUT/README.md" <<EOF
          # scaleout-build control plane ${V}

          Deploys the control plane into your AWS account as a **GraalVM native Lambda on arm64** --
          measured cold start 480-524 ms, 256 MB. Needs the AWS CLI with credentials, Node 20+, and
          Docker. No Maven or JDK required.

              ./install.sh --region eu-west-1

          See `./install.sh --help` for capacity strategy and other options. Full documentation:
          https://github.com/${{ github.repository }}
          EOF
          tar czf "${OUT}.tar.gz" "$OUT"
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"

      # Installing for real needs an AWS account, so this asserts what can be asserted without one: the
      # bundle is self-contained, the script parses, and the template is a CloudFormation template.
      - name: Check the bundle is self-contained
        run: |
          V="${{ steps.version.outputs.version }}"
          rm -rf /tmp/check && mkdir /tmp/check && tar xzf "scaleout-build-installer-${V}.tar.gz" -C /tmp/check
          cd "/tmp/check/scaleout-build-installer-${V}"
          bash -n install.sh
          test -f cdk.out/ScaleoutBuildControlPlane.template.json
          python3 -c "import json;t=json.load(open('cdk.out/ScaleoutBuildControlPlane.template.json'));assert t['Resources'],'no resources'"
          N="$(ls -d cdk.out/asset.* 2>/dev/null | wc -l)"
          test "$N" -eq 2 || { echo "::error::expected 2 staged assets (service zip + reaper jar), found $N"; exit 1; }
          ./install.sh --help >/dev/null

      # Also published standalone, for anyone deploying by a route other than install.sh -- their own
      # CDK, Terraform, or console. Named with the architecture because a native zip is not portable
      # between them, and an unlabelled one invites deploying it to the wrong Lambda.
      - name: Name the raw Lambda packages for release
        run: |
          V="${{ steps.version.outputs.version }}"
          cp assets/control-plane-native.zip "control-plane-native-arm64-${V}.zip"
          cp assets/reaper.jar "reaper-${V}.jar"
          sha256sum control-plane-native-arm64-*.zip reaper-*.jar > lambda-packages.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            scaleout-build-installer-*.tar.gz*
            control-plane-native-arm64-*.zip
            reaper-*.jar
            lambda-packages.sha256


  # ── publish-central ────────────────────────────────────────────────────────────────────────────
  # Publishes the same five modules to Maven Central via the Central Portal API.
  # Runs after publish-maven so the GitHub Packages deployment is confirmed first.
  # Requires namespace ai.codriverlabs to be verified at central.sonatype.com (done 2026-09-30).
  #
  # Secrets consumed:
  #   CENTRAL_TOKEN_USERNAME  -- portal token name (not your Sonatype login)
  #   CENTRAL_TOKEN_PASSWORD  -- portal token password
  #   MAVEN_GPG_PRIVATE_KEY   -- base64-encoded armored private key (4096 RSA, karol.piatek@codriverlabs.ai)
  #   MAVEN_GPG_PASSPHRASE    -- empty; the key has no passphrase protection
  #
  # Central is IMMUTABLE: once published a version cannot be deleted. The first real deploy should
  # be a patch version to verify the pipeline before shipping the real release.
  publish-central:
    needs: [publish-maven]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mvn -B versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Import GPG key
        run: |
          echo "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import --batch
          # Confirm it imported correctly.
          gpg --list-secret-keys karol.piatek@codriverlabs.ai

      - name: Write Central credentials to settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_TOKEN_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_TOKEN_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Sign and publish to Maven Central
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -Prelease -DskipTests \
            -pl .,scaleout-build-shared,scaleout-build-control-plane-api,scaleout-build-ecs,scaleout-build-maven-plugin


  # ── build-installer-image ──────────────────────────────────────────────────────────────────────
  # Builds the installer image on native runners for both amd64 and arm64.
  # Pushes arch-specific tags (installer:V-amd64, installer:V-arm64).
  # The installer-image-manifest job joins them into a multi-arch manifest.
  build-installer-image:
    needs: [package-installer]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the cdk.out from the installer artifact
        uses: actions/download-artifact@v5
        with:
          name: installer
          path: /tmp/installer-artifacts

      - name: Unpack cdk.out into the CDK infra directory
        run: |
          mkdir -p scaleout-build-control-plane-infra
          tar xzf /tmp/installer-artifacts/scaleout-build-installer-${{ steps.version.outputs.version }}.tar.gz \
            --strip-components=1 -C scaleout-build-control-plane-infra/ \
            "scaleout-build-installer-${{ steps.version.outputs.version }}/cdk.out"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch-specific installer image
        run: |
          V="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/installer"
          docker build -f installer/Dockerfile -t "${IMAGE}:${V}-${{ matrix.arch }}" .
          docker push "${IMAGE}:${V}-${{ matrix.arch }}"

  # ── installer-image-manifest ───────────────────────────────────────────────────────────────────
  # Joins the two arch-specific installer images into a single multi-arch manifest.
  installer-image-manifest:
    needs: [build-installer-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          V="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/installer"
          docker buildx imagetools create \
            -t "${IMAGE}:${V}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${V}-amd64" \
            "${IMAGE}:${V}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${V}"
          echo "### Installer image (multi-arch)" >> "$GITHUB_STEP_SUMMARY"
          echo "docker run --rm -it -v ~/.aws:/root/.aws:ro -e AWS_REGION=eu-west-1 ${IMAGE}:${V} --region eu-west-1 --yes" >> "$GITHUB_STEP_SUMMARY"

  # ── build-jvm-artifacts ────────────────────────────────────────────────────────────────────────
  # Packages the CLI fat jar and the MCP runner jar for inclusion in the GitHub Release.
  # These are the JVM variants — they run on any architecture without native-image compilation.
  build-jvm-artifacts:
    needs: [publish-maven]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - name: Build CLI fat jar and MCP runner jar
        run: |
          mvn -B package -DskipTests \
            -pl scaleout-build-cli,scaleout-build-mcp -am

      - name: Rename for release
        run: |
          V="${{ steps.version.outputs.version }}"
          cp scaleout-build-cli/target/scaleout-build-cli-${V}.jar     scaleout-cli-${V}.jar
          cp scaleout-build-mcp/target/scaleout-build-mcp-${V}-runner.jar scaleout-mcp-${V}-runner.jar
          sha256sum scaleout-cli-${V}.jar scaleout-mcp-${V}-runner.jar > jvm-artifacts.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: jvm-artifacts
          path: |
            scaleout-cli-*.jar
            scaleout-mcp-*-runner.jar
            jvm-artifacts.sha256

  # ── build-native-cli ───────────────────────────────────────────────────────────────────────────
  # Compiles the CLI to a native executable on both arm64 and amd64 using GraalVM Community Edition.
  # A native CLI has no JVM startup cost and ships as a single file with no runtime dependency.
  #
  # Uses graalvm/setup-graalvm to install GraalVM CE rather than container-build because the CLI uses
  # native-maven-plugin directly (not Quarkus), and container-build is a Quarkus-specific feature.
  build-native-cli:
    needs: [publish-maven]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
            binary: scaleout-arm64
          - runner: ubuntu-24.04
            arch: amd64
            binary: scaleout-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true

      # Build the fat jar first (native-maven-plugin uses it as its class path input).
      - name: Build fat jar then compile to native
        run: |
          mvn -B package -Pnative -DskipTests \
            -pl scaleout-build-cli -am

      - name: Verify binary and rename for release
        run: |
          V="${{ steps.version.outputs.version }}"
          BIN=scaleout-build-cli/target/scaleout
          test -f "$BIN" || { echo "::error::native binary not found at $BIN"; exit 1; }
          file "$BIN"
          # Quick sanity check: --help must exit 0
          "$BIN" --help > /dev/null
          cp "$BIN" "${{ matrix.binary }}-${V}"
          sha256sum "${{ matrix.binary }}-${V}" > "${{ matrix.binary }}-${V}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: native-cli-${{ matrix.arch }}
          path: |
            ${{ matrix.binary }}-*

  # ── build-native-mcp ───────────────────────────────────────────────────────────────────────────
  # Compiles the Quarkus MCP server to a native executable on arm64.
  # Uses quarkus.native.container-build=true (Mandrel in a container), matching the control-plane
  # native build pattern already used in ci.yml. No local GraalVM needed.
  # arm64 only: the MCP server is a local stdio process; users on x86_64 can run the JVM jar instead.
  build-native-mcp:
    needs: [publish-maven]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - name: Build MCP server native binary (Mandrel container build)
        run: |
          mvn -B package -Pnative -DskipTests \
            -Dquarkus.native.container-build=true \
            -pl scaleout-build-mcp -am

      - name: Verify binary and rename for release
        run: |
          V="${{ steps.version.outputs.version }}"
          BIN=scaleout-build-mcp/target/scaleout-build-mcp-${V}-runner
          test -f "$BIN" || { echo "::error::native MCP binary not found at $BIN"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' \
            || { echo "::error::expected ARM aarch64, got: $(file -b "$BIN")"; exit 1; }
          # Smoke test: missing SCALEOUT_ENDPOINT should print error and exit non-zero
          if "$BIN" 2>&1 | grep -qi 'error\|SCALEOUT_ENDPOINT'; then
            echo "startup check passed"
          fi
          cp "$BIN" "scaleout-mcp-arm64-${V}"
          sha256sum "scaleout-mcp-arm64-${V}" > "scaleout-mcp-arm64-${V}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: native-mcp-arm64
          path: |
            scaleout-mcp-arm64-*

  # ── release ────────────────────────────────────────────────────────────────────────────────────
  release:
    needs: [package-installer, publish-central, installer-image-manifest, build-jvm-artifacts, build-native-cli, build-native-mcp]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: jvm-artifacts
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: native-cli-arm64
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: native-cli-amd64
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: native-mcp-arm64
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          body: |
            ## Install the control plane

            ```bash
            TAG=${{ inputs.tag || github.ref_name }}
            curl -fsSL -O https://github.com/${{ github.repository }}/releases/download/${TAG}/scaleout-build-installer-${TAG#v}.tar.gz
            tar xzf scaleout-build-installer-${TAG#v}.tar.gz
            cd scaleout-build-installer-${TAG#v}
            ./install.sh --region eu-west-1
            ```

            Deploys a **GraalVM native Lambda on arm64** — measured cold start 480–524 ms at 256 MB.
            Needs the AWS CLI, Node 20+, and Docker. No Maven or JDK.

            ## CLI

            Native binaries (no JVM required):

            ```bash
            # arm64 (Apple Silicon, Graviton)
            curl -fsSL -o scaleout https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}/scaleout-arm64-${{ inputs.tag || github.ref_name }}
            chmod +x scaleout

            # amd64
            curl -fsSL -o scaleout https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}/scaleout-amd64-${{ inputs.tag || github.ref_name }}
            chmod +x scaleout

            # JVM fat jar (any platform, requires Java 21+)
            curl -fsSL -o scaleout.jar https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}/scaleout-cli-${{ inputs.tag || github.ref_name }}.jar
            java -jar scaleout.jar --help
            ```

            ```bash
            EP=$(aws ssm get-parameter --name /scaleout-build/control-plane/endpoint \
              --region eu-central-1 --query 'Parameter.Value' --output text)
            ./scaleout --endpoint "$EP" builds list
            ```

            ## MCP Server

            Add to your MCP client config (Kiro, Claude Desktop, etc.):

            ```json
            {
              "mcpServers": {
                "scaleout-build": {
                  "command": "java",
                  "args": ["-jar", "/path/to/scaleout-mcp-${{ inputs.tag || github.ref_name }}-runner.jar"],
                  "env": {
                    "SCALEOUT_ENDPOINT": "https://REPLACE.lambda-url.eu-central-1.on.aws/",
                    "AWS_REGION": "eu-central-1"
                  }
                }
              }
            }
            ```

            Or use the native binary on arm64:
            ```json
            {
              "command": "/path/to/scaleout-mcp-arm64-${{ inputs.tag || github.ref_name }}"
            }
            ```

            ## Agent image

            `${{ env.IMAGE }}:${{ inputs.tag || github.ref_name }}` — multi-architecture (`amd64`, `arm64`).

