# The Lambda Web Adapter connects to this port; CDK sets PORT=8080 on the function.
quarkus.http.port=${PORT:8080}

# Packaged as an uber-jar so the deployment zip is one artifact plus a bootstrap script.
# The native profile replaces this with a single `bootstrap` binary on provided.al2023.
quarkus.package.jar.type=uber-jar

# --- Authorization -------------------------------------------------------------------------
# Never enable the dev principal in a deployed environment. It exists so the service can be run
# locally, where there is no Lambda Web Adapter to supply x-amzn-request-context. It defaults to
# false so that a deployment which forgets to unset it still rejects unsigned requests rather than
# silently trusting a configured ARN.
scaleout.auth.allow-dev-principal=${SCALEOUT_AUTH_ALLOW_DEV_PRINCIPAL:false}
# Unset by default: an empty String is NOT the same as absent here (SmallRye converts "" to null
# and fails injection), so this key is simply omitted unless a local run supplies it.
# scaleout.auth.dev-principal-arn=arn:aws:iam::000000000000:user/localdev

# --- Storage -------------------------------------------------------------------------------
scaleout.builds-table=${SCALEOUT_BUILDS_TABLE:scaleout-builds}

# --- Logging -------------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."ai.codriverlabs".level=DEBUG
# JSON console logging so CloudWatch Logs Insights can query fields rather than regex lines.
quarkus.log.console.json=${SCALEOUT_LOG_JSON:false}

# --- Native image: index the modules holding the wire DTOs ---------------------------------------------
#
# Quarkus indexes its own application module, but NOT arbitrary dependency jars. The request and response
# records live in scaleout-build-control-plane-api and the enums they contain live in
# scaleout-build-shared, so without these entries Quarkus never sees those classes, never registers them
# for reflection, and native mode cannot serialize them:
#
#   Jackson was unable to serialize type 'ErrorResponse' ... This appears to be a native image, in which
#   case you may need to configure reflection for the class that is to be serialized
#
# JVM mode is unaffected, which is exactly why this was invisible until the first native deployment: the
# health endpoints kept working (Quarkus serves those itself) while every /builds response returned 500.
#
# Configured here rather than by adding a Jandex plugin to those modules, deliberately: the API module is
# also consumed by the Maven plugin, which must not acquire Quarkus build tooling. Indexing is the
# service's concern, so it is declared in the service's own configuration.
quarkus.index-dependency.controlplane-api.group-id=ai.codriverlabs
quarkus.index-dependency.controlplane-api.artifact-id=scaleout-build-control-plane-api
quarkus.index-dependency.build-shared.group-id=ai.codriverlabs
quarkus.index-dependency.build-shared.artifact-id=scaleout-build-shared

# --- Test profile -----------------------------------------------------------------------------------
#
# The required config above has no defaults on purpose: a deployment that forgets the staging bucket
# should fail loudly rather than invent a bucket name. A test that boots the application therefore has
# to supply them, and they belong here as %test. overrides rather than in a second
# src/test/resources/application.properties -- a test-scoped file of that name SHADOWS this one
# instead of layering over it, which produces "SRCFG00027: Could not find a mapping" rather than
# anything that points at the real cause.
#
# Obvious placeholders: ApplicationBootTest only starts the app and serves its health endpoints, and
# never calls AWS.
%test.scaleout.builds-table=test-builds
%test.scaleout.staging-bucket=test-staging-bucket
%test.scaleout.ecs.cluster-arn=arn:aws:ecs:eu-west-1:000000000000:cluster/test
%test.scaleout.ecs.subnet-ids=subnet-test1,subnet-test2
%test.scaleout.ecs.security-group-ids=sg-test
%test.scaleout.ecs.execution-role-arn=arn:aws:iam::000000000000:role/test-execution
%test.scaleout.ecs.task-role-arn=arn:aws:iam::000000000000:role/test-task
%test.scaleout.ecs.log-group-name=/scaleout-build/test
%test.scaleout.ecs.agent-image=000000000000.dkr.ecr.eu-west-1.amazonaws.com/scaleout-build-agent:latest

# Inert DynamoDB target so startup resolves a client without reaching AWS or a credential provider.
%test.quarkus.dynamodb.endpoint-override=http://localhost:8000
%test.quarkus.dynamodb.aws.region=eu-west-1
%test.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
# MicroVM admin configuration — all empty by default; set via CDK environment variables
scaleout.micro-vm.admin-role-arns=${SCALEOUT_MICROVM_ADMIN_ROLE_ARNS:}
scaleout.micro-vm.build-role-arn=${SCALEOUT_MICROVM_BUILD_ROLE_ARN:}
scaleout.micro-vm.artifacts-bucket-name=${SCALEOUT_MICROVM_ARTIFACTS_BUCKET:}
scaleout.micro-vm.execution-role-arn=${SCALEOUT_MICROVM_EXECUTION_ROLE_ARN:}
%test.scaleout.micro-vm.admin-role-arns=arn:aws:iam::000000000000:role/TestAdminRole
%test.scaleout.micro-vm.build-role-arn=arn:aws:iam::000000000000:role/TestMicrovmBuildRole
%test.scaleout.micro-vm.artifacts-bucket-name=test-microvm-artifacts
%test.scaleout.micro-vm.execution-role-arn=arn:aws:iam::000000000000:role/TestMicrovmExecutionRole
